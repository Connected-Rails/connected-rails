[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "train-sim"
path = "src/main.rs"

[dependencies]
i18n = { workspace = true }
sim-core = { workspace = true }
track-model = { workspace = true }
world-coords = { workspace = true }
content = { workspace = true }
mod-runtime = { workspace = true }
ai-driver = { workspace = true }
glam = { workspace = true }
# `wav`: the sound loops are generated at startup as WAV buffers (ch. 13), so rodio has
# to be able to decode them — Bevy only brings the ogg decoder by default.
bevy = { workspace = true, features = ["wav"] }

[features]
# Links Bevy as a shared library instead of statically: much faster relinks.
# Local development only, the resulting binary needs the Bevy DLL next to it.
dev = ["bevy/dynamic_linking"]
