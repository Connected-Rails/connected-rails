version: 2
updates:
  # One grouped pull request per week instead of one per crate. Bevy and its
  # ecosystem move together anyway, so a split would only mean broken lockfiles.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # glam has to stay on the version bevy_math pulls in. A second glam in the
      # tree makes Vec3 and Quat two unrelated types and nothing that touches a
      # Transform compiles. Bump it by hand together with bevy.
      - dependency-name: glam

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
