[workspace]
resolver = "3"
members = [
    "crates/i18n",
    "crates/world-coords",
    "crates/track-model",
    "crates/sim-core",
    "crates/content",
    "crates/mod-runtime",
    "crates/html-display",
    "crates/ai-driver",
    "crates/app",
    "crates/imagery",
    "crates/route-editor",
    "crates/vehicle-editor",
    "crates/signal-editor",
    "crates/editor-ui",
    "crates/world-render",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "EUPL-1.2"

[workspace.dependencies]
glam = { version = "0.32", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
# Lua 5.4, statically linked; `send` so the runtime can live in a Bevy resource.
mlua = { version = "0.12", features = ["lua54", "vendored", "send"] }
bevy = "0.19"
# Desktop UI of the editors: menu bar, docked panels (bevy_egui) and the operating
# system's own file dialogs (rfd).
bevy_egui = "0.41"
rfd = "0.17"

i18n = { path = "crates/i18n" }
world-coords = { path = "crates/world-coords" }
track-model = { path = "crates/track-model" }
sim-core = { path = "crates/sim-core" }
content = { path = "crates/content" }
mod-runtime = { path = "crates/mod-runtime" }
ai-driver = { path = "crates/ai-driver" }
imagery = { path = "crates/imagery" }
editor-ui = { path = "crates/editor-ui" }
world-render = { path = "crates/world-render" }

[profile.dev]
opt-level = 1
# Full debuginfo is the single largest input to the linker; line tables keep
# backtraces with file/line but cut link time and target/ size roughly in half.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
# Dependencies are rebuilt rarely and never stepped through in a debugger.
debug = false
