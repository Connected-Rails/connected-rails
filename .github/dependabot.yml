version: 2
updates:
  # One grouped pull request per week instead of one per crate. Bevy and its
  # ecosystem move together anyway, so a split would only mean broken lockfiles.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # glam has to stay on the version bevy_math pulls in. A second glam in the
      # tree makes Vec3 and Quat two unrelated types and nothing that touches a
      # Transform compiles. Bump it by hand together with bevy.
      - dependency-name: glam
      # bevy_egui 0.42 needs egui 0.36, but egui-phosphor (the icon font in
      # editor-ui) has no release for egui 0.36 yet. The bump leaves two epaint
      # versions in the tree and `FontData` becomes two unrelated types.
      # Bump it by hand together with egui-phosphor.
      - dependency-name: bevy_egui
      # taffy has to stay on the version bevy_ui ships; html-display pins the
      # same one so there is one layout engine in the tree. Bump it by hand
      # together with bevy.
      - dependency-name: taffy
      # wgpu has to stay on the version bevy_render pins; `app` names it only for
      # the types FSR hands to Bevy's own render device (`fsr.rs`), and wgpu-ffx
      # links against the same one. A second wgpu in the tree makes `Device`,
      # `Texture` and `TextureView` two unrelated types each. Bump it by hand
      # together with bevy.
      - dependency-name: wgpu

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
