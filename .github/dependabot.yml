version: 2
updates:
  # One grouped pull request per week instead of one per crate. Bevy and its
  # ecosystem move together anyway, so a split would only mean broken lockfiles.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
