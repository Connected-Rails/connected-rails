[workspace]
resolver = "3"
members = [
    "crates/i18n",
    "crates/app-icon",
    "crates/world-coords",
    "crates/track-model",
    "crates/sim-core",
    "crates/content",
    "crates/mod-runtime",
    "crates/html-display",
    "crates/ai-driver",
    "crates/app",
    "crates/imagery",
    "crates/route-editor",
    "crates/vehicle-editor",
    "crates/signal-editor",
    "crates/editor-ui",
    "crates/world-render",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "EUPL-1.2"

[workspace.dependencies]
glam = { version = "0.32", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
# Lua 5.4, statically linked; `send` so the runtime can live in a Bevy resource.
mlua = { version = "0.12", features = ["lua54", "vendored", "send"] }
# `wayland`: Bevy's default features only carry winit's X11 backend, so on a Wayland
# desktop every window would go through XWayland. Compiled in, winit picks Wayland
# whenever `WAYLAND_DISPLAY`/`WAYLAND_SOCKET` is set and falls back to X11 otherwise;
# on Windows and macOS the feature is inert.
bevy = { version = "0.19", features = ["wayland"] }
# Desktop UI of the editors: menu bar, docked panels (bevy_egui) and the operating
# system's own file dialogs (rfd).
bevy_egui = "0.41"
# Multiplayer over dedicated servers (ch. 20): netcode over UDP, messages and channels.
# Lightyear's own entity replication, prediction and interpolation stay off — a train runs
# on a track, so the app replicates the track position and the driver's setpoints itself.
lightyear = { version = "0.29", default-features = false, features = [
    "std",
    "client",
    "server",
    "netcode",
    "udp",
] }
rfd = "0.17"

i18n = { path = "crates/i18n" }
app-icon = { path = "crates/app-icon" }
world-coords = { path = "crates/world-coords" }
track-model = { path = "crates/track-model" }
sim-core = { path = "crates/sim-core" }
content = { path = "crates/content" }
mod-runtime = { path = "crates/mod-runtime" }
ai-driver = { path = "crates/ai-driver" }
imagery = { path = "crates/imagery" }
editor-ui = { path = "crates/editor-ui" }
world-render = { path = "crates/world-render" }

[profile.dev]
opt-level = 1
# Full debuginfo is the single largest input to the linker; line tables keep
# backtraces with file/line but cut link time and target/ size roughly in half.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
# Dependencies are rebuilt rarely and never stepped through in a debugger.
debug = false

# Release builds trade compile time for runtime: one codegen unit per crate and
# thin LTO let the optimiser see across crate boundaries.
[profile.release]
codegen-units = 1
lto = "thin"

[patch.crates-io]
egui-snarl = { path = "crates/egui-snarl" }
