"project_id_env": "CROWDIN_PROJECT_ID"
"api_token_env": "CROWDIN_PERSONAL_TOKEN"
"preserve_hierarchy": true

files:
  - source: /crates/i18n/locales/en/*.ftl
    translation: /crates/i18n/locales/%two_letters_code%/%original_file_name%
