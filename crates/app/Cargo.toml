[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "train-sim"
path = "src/main.rs"

[dependencies]
i18n = { workspace = true }
app-icon = { workspace = true }
sim-core = { workspace = true }
track-model = { workspace = true }
world-coords = { workspace = true }
content = { workspace = true }
mod-runtime = { workspace = true }
# HTML/CSS/JS cab screens (plan ch. 12). A gauge holds a boa context, which is
# `!Send` — the app keeps them in a non-send resource (displays.rs).
html-display = { path = "../html-display" }
ai-driver = { workspace = true }
lightyear = { workspace = true }
serde = { workspace = true }
world-render = { workspace = true }
glam = { workspace = true }
# `jpeg`: the menu wallpaper is a compiled-in JPEG (`images/`).
bevy = { workspace = true, features = ["jpeg", "bevy_settings"] }
# The mixer (plan ch. 13): buses, sends, per-track filters, reverb and a compressor —
# none of which Bevy's own audio has. `symphonia` and the format features are what lets a
# mod ship recorded samples; the generated sources need no decoder at all.
kira = { version = "0.12", default-features = false, features = [
    "cpal",
    "symphonia",
    "wav",
    "ogg",
    "vorbis",
    "flac",
] }

[features]
# Links Bevy as a shared library instead of statically: much faster relinks.
# Local development only, the resulting binary needs the Bevy DLL next to it.
dev = ["bevy/dynamic_linking"]

[target.'cfg(windows)'.build-dependencies]
# Compiles `icon.ico` into the executable's resource — see `build.rs`.
winresource = "0.1"
